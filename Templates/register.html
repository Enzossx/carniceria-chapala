<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css')}}">
    <title>Registro - Carnicería Chapala</title>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
        <div class="row w-100 align-items-center m-0">
            
            <div class="col-4 d-flex align-items-center p-0">
                <a class="navbar-brand m-0" href="/">
                    <img src="{{ url_for('static', filename='img/OIP.jpg') }}" alt="Logo" class="logo-img rounded-circle">
                </a>
            </div>

            <div class="col-4 text-center p-0">
                    <img src="{{ url_for('static', filename='img/carni.png') }}" alt="Carnicería Chapala" class="titulo-img-centrado">
            </div>
            
            <div class="col-4 d-flex justify-content-end align-items-center gap-3 p-0">
                <a class="nav-link text-white fw-semibold" href="#contacto">Contacto</a>
            </div>

        </div>
    </div>
</nav>

<main class="container d-flex justify-content-center align-items-center my-5" style="min-height: 70vh;">
    <div class="card p-4 shadow-lg rounded-4 border-0" style="max-width: 450px; width: 100%; background-color: #ffffff;">
        <h2 id="Subtitulo" class="text-center mb-4" style="margin-top: 0;">Crear Cuenta</h2>
        
        <form action="{{ url_for('register') }}" method="POST">
            <div class="mb-3">
                <label for="nombre" class="form-label fw-bold" style="font-family: 'Comic Neue', sans-serif;">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" class="form-control rounded-3 border-2" placeholder="Juan Pérez" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-bold" style="font-family: 'Comic Neue', sans-serif;">Correo Electrónico:</label>
                <input type="email" id="email" name="email" class="form-control rounded-3 border-2" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-bold" style="font-family: 'Comic Neue', sans-serif;">Contraseña:</label>
                <input type="password" id="password" name="password" class="form-control rounded-3 border-2" placeholder="••••••••" required>
            </div>

            <div class="mb-4 p-3 bg-light rounded-3 border d-flex align-items-center justify-content-between shadow-sm">
                <div class="form-check d-flex align-items-center gap-2 m-0">
                    <input class="form-check-input" type="checkbox" id="captcha-check-reg" required style="width: 22px; height: 22px; cursor: pointer;">
                    <label class="form-check-label fw-semibold text-secondary" for="captcha-check-reg" style="cursor: pointer; font-size: 0.95rem;">
                        No soy un robot
                    </label>
                </div>
                <div class="text-end">
                    <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" alt="reCAPTCHA" style="width: 30px; opacity: 0.7;">
                    <div style="font-size: 0.65rem; color: #888;">reCAPTCHA</div>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-rosa-destacado py-2 fs-5 rounded-pill shadow-sm">Registrarme</button>
            </div>

            <div class="text-center mt-3">
                <small class="text-muted">¿Ya tienes cuenta? <a href="login.html" class="fw-bold" style="color: var(--rosa-pastel-fuerte); text-decoration: none;">Inicia sesión</a></small>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/scripts.js"></script>
</body>
</html>
