<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>Carnicería Chapala</title>
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
        <div class="row w-100 align-items-center m-0">
            
            <div class="col-4 d-flex align-items-center p-0">
                <a class="navbar-brand m-0" href="{{ url_for('index') }}">
                    <img src="{{ url_for('static', filename='img/OIP.jpg') }}" alt="Logo" class="logo-img rounded-circle">
                </a>
            </div>

            <div class="col-4 text-center p-0">
                    <img src="{{ url_for('static', filename='img/carni.png') }}" alt="Carnicería Chapala" class="titulo-img-centrado">
            </div>


            <div class="col-4 d-flex justify-content-end align-items-center gap-3 p-0">
              <a class="nav-link text-white fw-semibold" href="#contacto">Contacto</a>
                 <div id="botones-sesion" class="d-flex gap-2 align-items-center">
                   <a href="{{ url_for('login') }}" class="btn btn-outline-light rounded-pill px-3">Iniciar Sesión</a>
                 </div>
                 <div">
                   <a href="{{ url_for('register') }}" class="btn btn-rosa-destacado rounded-pill px-3">Registrarse</a>
                 </div>
            </div>
        
        
    </div>
</div>
        
    </div>
</div>

            

        </div>
    </div>
</nav>

<!-- Buscador de Cortes -->
<div class="container my-4">
    <form action="{{ url_for('index') }}" method="GET" class="d-flex justify-content-center">
        <div class="input-group" style="max-width: 500px;">
            <input 
                type="text" 
                name="buscar" 
                class="form-control rounded-start-pill ps-4" 
                placeholder="Buscar corte (ej. Asado, Vacío)..." 
                value="{{ busqueda if busqueda else '' }}"
            >
            <button class="btn btn-danger rounded-end-pill px-4" type="submit">
                 Buscar
            </button>
        </div>
    </form>

    {% if busqueda %}
        <div class="text-center mt-2">
            <span class="text-white">Mostrando resultados para: <strong>"{{ busqueda }}"</strong></span>
            <a href="{{ url_for('index') }}" class="btn btn-sm btn-outline-light ms-2">Ver todos</a>
        </div>
    {% endif %}
</div>

<h2 id="Subtitulo2">Cortes</h2>

<!-- Carrusel de Cortes de Carne -->
<div class="carousel">
    <button class="arrow left" onclick="moveCarousel(-1, 'track2')">❮</button>
    <div class="viewport">
        <div class="track" id="track2">
            
            {% for corte in cortes %}
                <div class="team-container">
                    <div class="game team d-flex flex-column align-items-center justify-content-center bg-dark text-white p-3 rounded border border-danger">
                        <!-- Imagen genérica o estática para la carne -->
                        <img src="{{ url_for('static', filename='img/carnita.webp') }}" alt="{{ corte.nombre }}">
                        <span class="badge bg-danger mt-2 fs-6">${{ corte.precio }}</span>
                    </div>
                    <h4 class="team-label text-center mt-2">{{ corte.nombre }}</h4>
                </div>
            {% else %}
                <div class="text-center text-white py-4 w-100">
                    <p class="fs-5">No se encontraron cortes de carne disponibles.</p>
                </div>
            {% endfor %}

        </div> 
    </div> 
    <button class="arrow right" onclick="moveCarousel(1, 'track2')">❯</button>
</div>

<center class="my-4">
    <div>
        <a href="{{ url_for('nuevo_corte') }}" class="btn btn-success btn-lg px-4 rounded-pill">Añadir corte</a>
    </div>
</center>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
