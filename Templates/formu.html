<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css')}}">
    <title>Subidita de corte</title>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
        <div class="row w-100 align-items-center m-0">
            
            <div class="col-4 d-flex align-items-center p-0">
                <a class="navbar-brand m-0" href="inicio.html">
                    <img src="/static/img/OIP.jpg" alt="Logo" class="logo-img rounded-circle">
                </a>
            </div>

            <div class="col-4 text-center p-0">
                <a class="navbar-brand m-0 d-inline-block" href="inicio.html">
                    <img src="/static/img/Cool Text - Carniceria Chapala 512858047033236.png" alt="Carnicería Chapala" class="titulo-img-centrado">
                </a>
            </div>

            <div class="col-4 d-flex justify-content-end align-items-center gap-3 p-0">
                <a class="nav-link text-white fw-semibold" href="#contacto">Contacto</a>
                <div id="botones-sesion" class="d-flex gap-2 align-items-center">
                    <button class="btn btn-outline-light rounded-pill px-3" type="button">Iniciar Sesión</button>
                    <button class="btn btn-rosa-destacado rounded-pill px-3" type="button">Registrarse</button>
                </div>
            </div>

        </div>
    </div>
</nav>

<main class="container d-flex justify-content-center align-items-center my-5" style="min-height: 60vh;">
    <div class="card p-4 shadow-lg rounded-4 border-0 style-card-form" style="max-width: 450px; width: 100%; background-color: #ffffff;">
        <h2 id="Subtitulo" class="text-center mb-4" style="margin-top: 0;">Agregar Corte</h2>
        
        <form action="{{ url_for('nuevo_corte') }}" method="POST">
            <div class="mb-3">
                <label for="nombre" class="form-label fw-bold" style="font-family: 'Comic Neue', sans-serif;">Nombre del corte:</label>
                <input type="text" id="nombre" name="nombre" class="form-control rounded-3 border-2" placeholder="Ej: Bife de chorizo" required>
            </div>

            <div class="mb-4">
                <label for="precio" class="form-label fw-bold" style="font-family: 'Comic Neue', sans-serif;">Precio:</label>
                <div class="input-group">
                    <span class="input-group-text fw-bold" style="background-color: var(--rosa-pastel-fuerte); color: white;">$</span>
                    <input type="number" step="0.01" id="precio" name="precio" class="form-control rounded-end-3 border-2" placeholder="0.00" required>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-rosa-destacado py-2 fs-5 rounded-pill shadow-sm">Guardar</button>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/scripts.js"></script>
</body>
</html>
